<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Калькулятор в стиле mos.ru</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .fullscreen-images img {
      width: 100%;
      height: auto;
      display: block;
    }

    #toggle:not(:checked) ~ .fullscreen-images .img2,
    #toggle:checked ~ .fullscreen-images .img1 {
      display: none;
    }

    .logo-label {
      cursor: pointer;
      display: inline-block;
    }
    .logo-label img {
      height: 30px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <ul class="menu">
        <label for="toggle" class="logo-label">
          <img src="image.png" alt="Логотип" class="logo" height="30px">
        </label>
        <li><a href="#" class="menu-link">Лаб1</a></li>
        <li class="dropdown">
          <a href="#" class="menu-link">Задание</a>
          <div class="dropdown-content">
            <a href="calculator2.html">Задание 1: Калькулятор</a>
            <a href="#">Задание 2: Стиль - mos.ru</a>
            <a href="#">Задание 3: Футер и хедер</a>
          </div>
        </li>
      </ul>
    </nav>
  </header>

    <input type="checkbox" id="toggle" style="display: none;">

    <div class="fullscreen-images">
      <img src="image1.png" alt="Картинка 1" class="img1">
      <img src="image2.png" alt="Картинка 2" class="img2">
    </div>

  <main>

    <div class="calculator-container">
      <div id="result" class="result">
        0
      </div>
      <div class="buttons">
        <div>
          <button id="btn_op_clear" class="my-btn secondary">C</button>
          <button id="btn_op_sign" class="my-btn secondary">+/-</button>
          <button id="btn_op_percent" class="my-btn secondary">%</button>
          <button id="btn_op_div" class="my-btn primary">/</button>
        </div>
        <div>
          <button id="btn_digit_7" class="my-btn">7</button>
          <button id="btn_digit_8" class="my-btn">8</button>
          <button id="btn_digit_9" class="my-btn">9</button>
          <button id="btn_op_mult" class="my-btn primary">x</button>
        </div>
        <div>
          <button id="btn_digit_4" class="my-btn">4</button>
          <button id="btn_digit_5" class="my-btn">5</button>
          <button id="btn_digit_6" class="my-btn">6</button>
          <button id="btn_op_minus" class="my-btn primary">-</button>
        </div>
        <div>
          <button id="btn_digit_1" class="my-btn">1</button>
          <button id="btn_digit_2" class="my-btn">2</button>
          <button id="btn_digit_3" class="my-btn">3</button>
          <button id="btn_op_plus" class="my-btn primary">+</button>
        </div>
        <div>
          <button id="btn_digit_0" class="my-btn">0</button>
          <button id="btn_digit_dot" class="my-btn secondary">.</button>
          <button id="btn_op_equal" class="my-btn primary execute">=</button>
        </div>
      </div>

      <details class="author-details">
        <summary>Автор</summary>
        <p>ФИО: Гудис Алексей</p>
      </details>
    </div>
  </main>

  <footer>
    <ul class="footer-links">
      <li><a href="#">О нас</a></li>
      <li><a href="#">Контакты</a></li>
      <li><a href="https://github.com/GudAlex61">GitHub</a></li>
    </ul>
  </footer>
</body>
</html>
